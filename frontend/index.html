<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <title>jokesmith.lol</title>
    <script>
      // Apply the saved scheme (ThemeToggle, via Mantine's localStorage manager)
      // before first paint, so a light-mode reload never flashes the dark stage.
      try {
        // Own key, so apps sharing this origin don't clash; carry the old shared one over once.
        var k = 'jokesmith.color-scheme', old = localStorage.getItem('mantine-color-scheme-value')
        if (localStorage.getItem(k) === null && old !== null) localStorage.setItem(k, old)
        var s = localStorage.getItem(k) || 'auto'
        if (s === 'auto') s = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        document.documentElement.setAttribute('data-mantine-color-scheme', s)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

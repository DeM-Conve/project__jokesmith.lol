# Full stack: `docker compose up --build` -> http://localhost:8200
# Dev database only: `docker compose up -d db` (Postgres on 127.0.0.1:5433)
name: jokesmith

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: jokesmith
      POSTGRES_USER: jokesmith
      POSTGRES_PASSWORD: jokesmith
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-dev-dbs.sql:/docker-entrypoint-initdb.d/init-dev-dbs.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jokesmith -d jokesmith"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/jokesmith
      DB_USER: jokesmith
      DB_PASSWORD: jokesmith
      SERVER_PORT: "48200"
      FRONTEND_URL: http://localhost:8200
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:8200:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:

# Full stack: `docker compose up -d --build` -> http://localhost:8200
# Dev database only: `docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d db`
#   (Postgres on 127.0.0.1:5433; see docker-compose.dev.yml)
# Configuration: copy .env.example to .env; every value below has a working local default.
name: jokesmith

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE_NAME:-jokesmith}
      POSTGRES_USER: ${DB_USERNAME:-jokesmith}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-jokesmith}
      TZ: ${TZ:-UTC}
    volumes:
      # A bare name is the named volume below; a path (./pgdata, /srv/jokesmith/pgdata) is a bind mount.
      - ${DB_DATA_LOCATION:-pgdata}:/var/lib/postgresql/data
      - ./scripts/init-dev-dbs.sql:/docker-entrypoint-initdb.d/init-dev-dbs.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_DATABASE_NAME:-jokesmith}
      DB_USER: ${DB_USERNAME:-jokesmith}
      DB_PASSWORD: ${DB_PASSWORD:-jokesmith}
      SERVER_PORT: "48200"
      FRONTEND_URL: ${JOKESMITH_URL:-http://localhost:8200}
      BASE_PATH: ${JOKESMITH_BASE_PATH:-}
      TZ: ${TZ:-UTC}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        BASE_PATH: ${JOKESMITH_BASE_PATH:-}
    ports:
      - "${JOKESMITH_BIND:-127.0.0.1}:${JOKESMITH_PORT:-8200}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # Nightly backups: a gzipped plain-SQL pg_dump of the database into BACKUP_LOCATION
  # (last/, daily/, weekly/, monthly/), old ones pruned. Restore one with scripts/restore.sh.
  backup:
    image: prodrigestivill/postgres-backup-local:17
    # Runs as you, so the dumps are yours (set PUID/PGID in .env to `id -u` / `id -g`).
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${DB_DATABASE_NAME:-jokesmith}
      POSTGRES_USER: ${DB_USERNAME:-jokesmith}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-jokesmith}
      POSTGRES_EXTRA_OPTS: -Z6 --no-owner --no-privileges
      SCHEDULE: ${BACKUP_SCHEDULE:-@daily}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-7}
      BACKUP_KEEP_WEEKS: ${BACKUP_KEEP_WEEKS:-4}
      BACKUP_KEEP_MONTHS: ${BACKUP_KEEP_MONTHS:-6}
      TZ: ${TZ:-UTC}
    volumes:
      # Must exist and be writable by PUID:PGID (./backups ships with the repo).
      - ${BACKUP_LOCATION:-./backups}:/backups
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/ || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:

server:
  port: ${SERVER_PORT:48200}
  # Behind nginx (and maybe a TLS proxy in front of it): trust X-Forwarded-Proto/For so
  # request.isSecure() reflects the browser's scheme (the pid cookie gets Secure on https).
  forward-headers-strategy: native
  compression:
    enabled: true
    mime-types: application/json,application/problem+json,text/plain

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5200}

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/jokesmith}
    username: ${DB_USER:jokesmith}
    password: ${DB_PASSWORD:jokesmith}
  mvc:
    problemdetails:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema (src/main/resources/db/migration); Hibernate only checks it.
      ddl-auto: validate
  flyway:
    # Each feature owns a version range (see CLAUDE.md), so they can land in any order.
    out-of-order: true
